# setup.cfg
# ============================================================
# Configuración de coverage.py para el SGEP
# Ubicar en la raíz del proyecto junto a pytest.ini
# ============================================================

[coverage:run]
# Módulos a medir
source = apps

# Archivos a omitir (no merecen cobertura)
omit =
    */migrations/*
    */venv/*
    */settings*.py
    */__pycache__/*
    */tests*.py
    */conftest.py
    */manage.py
    */wsgi.py
    */asgi.py
    */admin.py
    */apps.py
    */serializers.py

# Activar cobertura de ramas (branch coverage)
branch = True

[coverage:report]
# Umbrales de calidad
fail_under = 80

# Archivos a excluir del reporte
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    pass
    ...

# Formato del reporte
show_missing = True
skip_covered = False
precision = 1

[coverage:html]
directory = htmlcov
title = SGEP - Reporte de Cobertura de Pruebas
