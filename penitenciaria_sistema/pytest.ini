# pytest.ini
# ============================================================
# Configuración de pytest para el SGEP
# Ubicar en la raíz del proyecto:
#   penitenciaria_sgep_v3/penitenciaria_sistema/pytest.ini
# ============================================================

[pytest]
# Django settings
DJANGO_SETTINGS_MODULE = config.settings

# Directorio base de pruebas
testpaths = tests_sgep

# Plugins activos
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -p no:warnings

# Marcadores personalizados
markers =
    caja_negra: Pruebas de caja negra (partición de equivalencia, valores límite)
    caja_blanca: Pruebas de caja blanca (cobertura de ramas, caminos)
    integracion: Pruebas de integración entre módulos
    seguridad: Pruebas de seguridad y control de acceso
    login: Pruebas del módulo de autenticación
    internos: Pruebas del módulo de gestión de internos
    evaluaciones: Pruebas del módulo de evaluaciones psicológicas
    ia: Pruebas del motor de IA heurístico
    reportes: Pruebas de generación de reportes
    slow: Pruebas que pueden demorar más de 1 segundo

# Filtros de advertencias
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
